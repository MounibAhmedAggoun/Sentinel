server {
    listen 80;
    server_name _;

    # Deliberately misconfigured for the Sentinel lab:
    # no security headers, nginx version shown in the Server header,
    # and a made-up X-Powered-By header that reveals a runtime version.
    server_tokens on;
    add_header X-Powered-By "PHP/7.4.3" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}