# Sentinel lab: deliberately misconfigured services for testing.
# Every service is bound to its own loopback address, so it can be scanned
# on the real ports 80 and 443. Nothing here is reachable from other machines.
#
#   docker compose -f lab/docker-compose.yml up -d
#   sentinel scan 127.0.0.2 --allow-private

services:
  # No security headers, and the software version is disclosed.
  nginx-bare:
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.2:80:80'
    volumes:
      - ./nginx-bare/default.conf:/etc/nginx/conf.d/default.conf:ro
